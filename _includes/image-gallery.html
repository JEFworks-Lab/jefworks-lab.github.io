<!-- modified from https://jekyllcodex.org/without-plugin/image-gallery/# -->
<style>
    .image-gallery {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 767px) {
      .image-gallery {grid-template-columns: repeat(2, 1fr); gap: 8px;}
    }
    .image-gallery li a {display: block; text-decoration: none!important; color: #777;}
    .image-gallery img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 9px;
    }
</style>

<ul class="image-gallery">
  {% for item in site.data.carousel.images %}
  <li>
    <a href="{{ item.image }}">
      <img src="{{ item.image }}" alt="{{ item.alt | default: 'JEFworks Lab photo' }}" loading="lazy">
    </a>
  </li>
  {% endfor %}
</ul>


<!-- lightbox -->
<script type="text/javascript" src="/js/lightbox.js"></script>
<link rel="stylesheet" href="/css/lightbox.css">
